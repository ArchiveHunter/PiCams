<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PiCams Control</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg:      #0d0d0d;
    --surface: #1a1a1a;
    --border:  #2a2a2a;
    --text:    #f0f0f0;
    --muted:   #666;
    --accent:  #4fc3f7;
    --green:   #43a047;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(13,13,13,0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-title { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.04em; }
  .header-title span { color: var(--accent); }

  #status-badge {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.78rem;
    color: var(--muted);
    background: var(--surface);
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    transition: all 0.3s;
  }
  #status-badge.active { color: var(--accent); border-color: var(--accent); }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }
  #status-badge.active .status-dot { background: var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  #now-showing {
    margin: 16px 16px 0;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transition: all 0.3s;
  }
  #now-showing.fullscreen-mode { border-color: var(--accent); background: rgba(79,195,247,0.08); }

  .now-showing-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 3px; }
  .now-showing-value { font-size: 0.95rem; font-weight: 600; }

  #grid-btn {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 18px;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.15s;
    display: none;
  }
  #grid-btn:active { transform: scale(0.95); opacity: 0.8; }
  #now-showing.fullscreen-mode #grid-btn { display: block; border-color: var(--accent); color: var(--accent); }

  #camera-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 16px;
  }

  .cam-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.2s;
    position: relative;
  }
  .cam-card:active { transform: scale(0.97); }
  .cam-card.is-active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,195,247,0.2); }

  .cam-thumb {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
    background: #111;
  }

  .cam-info {
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .cam-name { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cam-action { font-size: 0.72rem; color: var(--accent); font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .cam-card.is-active .cam-action { color: var(--green); }

  .active-indicator {
    position: absolute;
    top: 8px; right: 8px;
    background: var(--accent);
    color: #000;
    font-size: 0.62rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 10px;
    letter-spacing: 0.06em;
    display: none;
  }
  .cam-card.is-active .active-indicator { display: block; }

  #conn-bar {
    display: none;
    background: #b71c1c;
    color: #fff;
    text-align: center;
    padding: 10px;
    font-size: 0.82rem;
    font-weight: 600;
  }
  #conn-bar.show { display: block; }
</style>
</head>
<body>

<div id="conn-bar">Reconnecting to PiCams…</div>

<header>
  <div class="header-title">Pi<span>Cams</span></div>
  <div id="status-badge">
    <div class="status-dot"></div>
    <span id="status-text">Connecting…</span>
  </div>
</header>

<div id="now-showing">
  <div>
    <div class="now-showing-label">TV is showing</div>
    <div class="now-showing-value" id="now-showing-value">Grid view</div>
  </div>
  <button id="grid-btn" onclick="sendGrid()">⊞ Grid view</button>
</div>

<div id="camera-grid"></div>

<script>
  let cameras = [];
  let state   = { mode: 'grid', activeCamera: null };
  let ws;
  let snapInterval;

  async function init() {
    const res = await fetch('/api/cameras');
    cameras = await res.json();
    buildGrid();
    connect();
    startSnapshots();
  }

  function buildGrid() {
    const grid = document.getElementById('camera-grid');
    grid.innerHTML = '';
    cameras.forEach(cam => {
      const card = document.createElement('div');
      card.className = 'cam-card';
      card.id = `card-${cam.id}`;
      card.innerHTML = `
        <img class="cam-thumb" id="snap-${cam.id}" src="/snapshot/${cam.streamLo}" alt="${cam.name}">
        <div class="active-indicator">ON TV</div>
        <div class="cam-info">
          <span class="cam-name">${cam.name}</span>
          <span class="cam-action" id="action-${cam.id}">▶ Fullscreen</span>
        </div>`;
      card.addEventListener('click', () => {
        if (state.mode === 'fullscreen' && state.activeCamera === cam.id) {
          sendGrid();
        } else {
          sendFullscreen(cam.id);
        }
      });
      grid.appendChild(card);
    });
  }

  function startSnapshots() {
    snapInterval = setInterval(() => {
      cameras.forEach(cam => {
        const img = document.getElementById(`snap-${cam.id}`);
        if (img) img.src = `/snapshot/${cam.streamLo}?t=${Date.now()}`;
      });
    }, 5000);
  }

  function applyState(newState) {
    if (newState.cameras) cameras = newState.cameras;
    state = newState;

    const badge  = document.getElementById('status-badge');
    const banner = document.getElementById('now-showing');
    const nowVal = document.getElementById('now-showing-value');

    badge.classList.add('active');
    document.getElementById('status-text').textContent = 'Connected';

    if (state.mode === 'fullscreen' && state.activeCamera) {
      const cam = cameras.find(c => c.id === state.activeCamera);
      nowVal.textContent = cam ? cam.name : state.activeCamera;
      banner.classList.add('fullscreen-mode');
    } else {
      nowVal.textContent = 'Grid view';
      banner.classList.remove('fullscreen-mode');
    }

    cameras.forEach(cam => {
      const card   = document.getElementById(`card-${cam.id}`);
      const action = document.getElementById(`action-${cam.id}`);
      if (!card) return;
      const isActive = state.mode === 'fullscreen' && state.activeCamera === cam.id;
      card.classList.toggle('is-active', isActive);
      action.textContent = isActive ? '✓ Showing' : '▶ Fullscreen';
    });
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}`);

    ws.onopen  = () => document.getElementById('conn-bar').classList.remove('show');
    ws.onclose = () => {
      document.getElementById('status-badge').classList.remove('active');
      document.getElementById('status-text').textContent = 'Offline';
      document.getElementById('conn-bar').classList.add('show');
      setTimeout(connect, 3000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = e => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state') applyState(msg);
    };
  }

  function send(cmd) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(cmd));
  }

  function sendFullscreen(cameraId) { send({ action: 'fullscreen', camera: cameraId }); }
  function sendGrid()               { send({ action: 'grid' }); }

  init();
</script>
</body>
</html>
